name: BETA clean checkout and portable Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      E2E_BROWSER: chromium
      E2E_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: node scripts/sidebar-layout-check.mjs
      - run: node scripts/update-ui-check.mjs
      - run: node scripts/bridge-check.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-source-evidence
          path: artifacts/
  windows-build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s desktop -p "test_*.py"
      - run: node scripts/sidebar-layout-check.mjs
      - run: node scripts/settings-ui.mjs
      - run: node scripts/update-ui-check.mjs
      - run: choco install ffmpeg --yes --no-progress
      - run: python scripts/frame-detail-check.py
      - run: python scripts/playback-matrix.py
      - run: ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=15 -t 110 -c:v libx264 -preset ultrafast -crf 30 -pix_fmt yuv420p artifacts/cloud-fixture.mp4
      - run: node scripts/desktop-keyframes-check.mjs --no-ocr
        env:
          E2E_VIDEO: artifacts/cloud-fixture.mp4
      - run: python scripts/prepare-native-runtime.py
      - run: python scripts/build-desktop.py dist/cloud-beta
      - uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-media
          path: artifacts/playback-matrix/720p-60.mp4
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable-beta
          path: dist/cloud-beta/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-source-evidence
          path: |
            artifacts/*.json
            artifacts/*.png
  windows-runtime:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: windows-portable-beta
          path: portable
      - uses: actions/download-artifact@v7
        with:
          name: windows-smoke-media
          path: smoke-media
      - run: ./scripts/windows-runtime-check.ps1 -Package "portable/Vidence" -Media "smoke-media/720p-60.mp4"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-runtime-evidence
          path: artifacts/cloud-runtime.json
  release:
    needs: [source, windows-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: windows-portable-beta
          path: portable
      - name: Package the validated files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root = Path('portable'); output = Path('release/Vidence-Windows-x64.zip')
          output.parent.mkdir()
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as bundle:
              for file in root.rglob('*'):
                  if file.is_file(): bundle.write(file, file.relative_to(root))
          with output.open('rb') as stream: digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          output.with_suffix('.zip.sha256').write_text(f'{digest}  {output.name}\n')
          PY
      - name: Publish a BETA release after validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(python -c "import json;print('v'+json.load(open('package.json'))['version'])")
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This version already exists; its release and assets stay unchanged.'
            exit 0
          fi
          gh release create "$tag" release/Vidence-Windows-x64.zip release/Vidence-Windows-x64.zip.sha256 --target "$GITHUB_SHA" --prerelease --title "Vidence $tag · BETA" --notes-file docs/release-notes.md
